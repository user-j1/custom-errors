<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 — Access denied</title>
    <link rel="stylesheet" href="files/error-site.css">
</head>
<body>
    <main class="error-page">
        <img class="brand" src="files/army-logo.png" width="300" height="113" alt="U.S. Army">
        <section class="error-content" aria-labelledby="error-title">
            <p class="status-code">Error 403</p>

            <a class="button" href="/">Return to the home page</a>
        </section>
    </main>

</html>
