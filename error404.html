<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Page not found</title>
    <link rel="stylesheet" href="files/error-site.css">
</head>
<body>
    <main class="error-page">
        <img class="brand" src="files/army-logo.png" width="300" height="113" alt="U.S. Army">
        <section class="error-content" aria-labelledby="error-title">
            <p class="status-code">Error 404</p>
            <h1 id="error-title">Page not found</h1>
            <p>We could not find the page you requested.</p>
            <p>Check the address for typing errors, or return to the home page.</p>
            <a class="button" href="/">Return to the home page</a>
        </section>
    </main>
</body>
</html>
