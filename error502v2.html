    <title>502 — Bad gateway</title>
    <style>
:root {
    color-scheme: dark;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    background: #000;
    color: #fff;
}

.error-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    width: min(100%, 72rem);
    min-height: 100vh;
    margin: 0 auto;
    padding: clamp(2rem, 7vw, 6rem);
    text-align: left;
}

.brand {
    display: block;
    width: min(240px, 70vw);
    height: auto;
    margin-bottom: 2rem;
}

.error-content {
    width: 100%;
    max-width: 44rem;
    padding-top: 2rem;
    border-top: 2px solid #ffcb05;
}

.status-code {
    margin: 0 0 0.75rem;
    color: #ffcb05;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

h1 {
    margin: 0 0 1.25rem;
    color: #ffcb05;
    font-size: clamp(1.5rem, 3.5vw, 1.75rem);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
}

p {
    max-width: 40rem;
    margin: 0.625rem 0;
    font-size: 0.9375rem;
    font-weight: 400;
    line-height: 1.65;
}

.button {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.7rem 1rem;
    border: 1px solid #ffcb05;
    border-radius: 0.2rem;
    background: transparent;
    color: #ffcb05;
    font-size: 0.875rem;
    font-weight: 600;
    text-decoration: none;
}

.button:hover {
    background: #ffcb05;
    color: #000;
}

.button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
}

@media (max-width: 30rem) {
    .error-page {
        justify-content: flex-start;
        padding: 2rem 1.25rem;
    }

    .brand {
        width: min(210px, 70vw);
        margin-bottom: 1.5rem;
    }

    .error-content {
        padding-top: 1.5rem;
    }
}
